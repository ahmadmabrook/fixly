openapi: 3.0.3
info:
  title: Fixly API
  version: 1.0.0
  description: |
    Public + admin HTTP API for Fixly. All responses follow the project's
    envelope contract: `{ "data": ... }` on success and
    `{ "error": { "code": string, "message": string } }` on failure. The
    socket.io surface (`booking:status`, `location:update`) is documented
    under the `Realtime` tag.
servers:
  - url: /api/v1
    description: Same-origin (proxied via Vite in dev, ingress in prod)

tags:
  - name: Health
  - name: Auth
  - name: Services
  - name: Reviews
  - name: Promo
  - name: Bookings
  - name: Addresses
  - name: PaymentMethods
  - name: Notifications
  - name: Devices
  - name: Guarantee
  - name: Support
  - name: Subscriptions
    description: Customer "Protection" plan (priority dispatch, discount, extended guarantee, quarterly inspection).
  - name: Credits
    description: Customer service-credit wallet (late-arrival compensation, referral, goodwill).
  - name: Quotes
    description: Video pre-check quotes — a customer uploads a problem video for a firm price before booking.
  - name: Conduct
    description: Customer-filed conduct reports (off-platform solicitation, no-show, quality, safety).
  - name: Referrals
    description: Invite-code referral program.
  - name: Uploads
    description: Presigned-upload issuance for all media-upload fields in the app.
  - name: Technician
    description: Technician self-service portal (onboarding, availability, jobs, earnings, withdrawals).
  - name: Admin
  - name: Realtime
    description: Socket.io events on `/socket.io` (WebSocket-first, polling fallback).

# ---------------------------------------------------------------------------
# Security: every non-public endpoint expects a JWT in the Authorization
# header. Admin endpoints additionally require the caller to be an active
# ADMIN-role user (server-enforced).
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: phone must be a valid mobile number }

    Meta:
      type: object
      properties:
        total: { type: integer, example: 42 }
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }

    Tokens:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string, description: Short-lived JWT, 15 min TTL. }
        refreshToken: { type: string, description: Long-lived opaque token, 30 day TTL. }
        expiresIn: { type: integer, example: 900 }

    Service:
      type: object
      properties:
        id: { type: string, example: elec }
        nameAr: { type: string, example: كهرباء }
        nameEn: { type: string, example: Electricity }
        descriptionAr: { type: string, nullable: true }
        priceJod: { type: string, example: '50.00' }
        durationMin: { type: integer, example: 45 }
        isActive: { type: boolean, example: true }
        category: { type: string, nullable: true, example: HOME_REPAIR }

    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [AWAITING_PAYMENT, PENDING, CONFIRMED, EN_ROUTE, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED, DISPUTED, NO_SHOW]
        scheduledAt: { type: string, format: date-time, nullable: true }
        totalJod: { type: string, example: '50.00' }
        service: { $ref: '#/components/schemas/Service' }

    CheckoutSession:
      type: object
      description: >
        Hosted-checkout session for a real PSP (HyperPay COPYandPAY). The client loads
        `scriptUrl?checkoutId=…` and renders a widget for the allowed card `brands`.
      properties:
        checkoutId: { type: string }
        scriptUrl: { type: string, format: uri }
        brands:
          type: array
          items: { type: string }
          example: [VISA, MASTER]

    CreateBookingInput:
      type: object
      required: [serviceId, addressLine, addressLat, addressLng]
      properties:
        serviceId: { type: string }
        addressLine: { type: string, minLength: 3, maxLength: 250 }
        addressLat: { type: number, minimum: -90, maximum: 90 }
        addressLng: { type: number, minimum: -180, maximum: 180 }
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO-8601 timestamp. Omit / set null for "now" (within 30 min).

    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    DashboardSummary:
      type: object
      properties:
        totalBookings: { type: integer }
        pendingBookings: { type: integer }
        completedBookings: { type: integer }
        totalTechnicians: { type: integer }
        verifiedTechnicians: { type: integer }
        totalRevenueJod: { type: string }
        pendingPayouts: { type: integer }

    Technician:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        phone: { type: string }
        isVerified: { type: boolean }
        rating: { type: number, format: float, nullable: true }
        completedJobs: { type: integer }

    Payout:
      type: object
      properties:
        id: { type: string }
        technicianId: { type: string }
        amountJod: { type: string }
        status: { type: string, enum: [PENDING, PROCESSED, FAILED] }
        requestedAt: { type: string, format: date-time }

    PromoQuote:
      type: object
      properties:
        code: { type: string }
        discountJod: { type: string }
        finalJod: { type: string }
        originalJod: { type: string }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        photos: { type: array, items: { type: string } }
        reviewerName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        line: { type: string }
        lat: { type: number }
        lng: { type: number }
        building: { type: string, nullable: true }
        apartment: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        isDefault: { type: boolean }

    PaymentMethod:
      type: object
      description: Display metadata only — never a PAN.
      properties:
        id: { type: string, format: uuid }
        brand: { type: string }
        last4: { type: string }
        expMonth: { type: integer }
        expYear: { type: integer }
        isDefault: { type: boolean }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        titleAr: { type: string }
        bodyAr: { type: string }
        isRead: { type: boolean }
        bookingId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    GuaranteeTicket:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, REJECTED] }
        description: { type: string, nullable: true }
        mediaUrls: { type: array, items: { type: string } }
        adminNote: { type: string, nullable: true }
        scheduledVisitAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    SupportMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        senderRole: { type: string, enum: [CUSTOMER, ADMIN] }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    SupportTicket:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, CLOSED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messages: { type: array, items: { $ref: '#/components/schemas/SupportMessage' } }

    TechnicianProfileMe:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, SUSPENDED] }
        isVerified: { type: boolean }
        isAvailable: { type: boolean }
        rejectionReason: { type: string, nullable: true }
        hourlyRateJod: { type: string, nullable: true }
        vehicle: { type: string, nullable: true }
        rating: { type: string }
        totalReviews: { type: integer }
        services: { type: array, items: { type: object } }

    TechEarnings:
      type: object
      properties:
        todayJod: { type: string }
        monthJod: { type: string }
        totalJod: { type: string }
        balanceJod: { type: string }
        lastWithdrawalAt: { type: string, format: date-time, nullable: true }

    Withdrawal:
      type: object
      properties:
        id: { type: string, format: uuid }
        amountJod: { type: string }
        status: { type: string, enum: [REQUESTED, PROCESSING, PAID, REJECTED] }
        iban: { type: string, nullable: true }
        bankName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    FinancialReport:
      type: object
      properties:
        series:
          type: array
          items:
            type: object
            properties:
              period: { type: string, format: date-time }
              bookings: { type: integer }
              grossJod: { type: number }
              platformFeeJod: { type: number }
              technicianNetJod: { type: number }
        totals:
          type: object
          properties:
            bookings: { type: integer }
            grossJod: { type: number }
            platformFeeJod: { type: number }
            technicianNetJod: { type: number }

    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [SUPER_ADMIN, OPS, FINANCE, SUPPORT] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        planSlug: { type: string, example: protect }
        status: { type: string, enum: [ACTIVE, PAST_DUE, CANCELLED, EXPIRED] }
        priceJod: { type: string, example: '5.000' }
        discountPercent: { type: integer, example: 15 }
        guaranteeDays: { type: integer, example: 90 }
        priorityDispatch: { type: boolean }
        inspectionEveryDays: { type: integer, example: 90 }
        nextInspectionAt: { type: string, format: date-time, nullable: true }
        currentPeriodEnd: { type: string, format: date-time }
        paymentToken: { type: string, nullable: true, description: PSP card-on-file token — never a PAN. }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    SubscriptionCharge:
      type: object
      properties:
        id: { type: string, format: uuid }
        amountJod: { type: string, example: '5.000' }
        status: { type: string, enum: [PENDING, PRE_AUTHORIZED, CAPTURED, PARTIALLY_REFUNDED, REFUNDED, DISPUTED, CHARGEBACK, FAILED] }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        chargedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    SubscriptionWithCharges:
      description: The customer's latest subscription (any status) with up to 6 recent charges.
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          properties:
            charges: { type: array, items: { $ref: '#/components/schemas/SubscriptionCharge' } }

    ServiceCredit:
      type: object
      description: A signed wallet ledger row — positive amounts are grants, negative are redemptions.
      properties:
        id: { type: string, format: uuid }
        amountJod: { type: string, example: '20.000' }
        reason: { type: string, enum: [LATE_COMPENSATION, REFERRAL, GOODWILL, PROMO, ADJUSTMENT, REDEMPTION] }
        bookingId: { type: string, format: uuid, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    BookingQuote:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        serviceId: { type: string }
        status: { type: string, enum: [PENDING, QUOTED, ACCEPTED, DECLINED, EXPIRED] }
        videoUrl: { type: string, format: uri }
        description: { type: string, nullable: true }
        quotedJod: { type: string, nullable: true, example: '75.000' }
        addressLine: { type: string, nullable: true }
        addressLat: { type: number, nullable: true }
        addressLng: { type: number, nullable: true }
        bookingId: { type: string, format: uuid, nullable: true }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    ConductReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [OFF_PLATFORM_SOLICIT, NO_SHOW, QUALITY, SAFETY, OTHER] }
        status: { type: string, enum: [OPEN, REVIEWING, UPHELD, DISMISSED] }
        subjectTechId: { type: string, format: uuid, nullable: true }
        bookingId: { type: string, format: uuid, nullable: true }
        details: { type: string, nullable: true }
        resolvedById: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe (cheap)
      responses:
        '200': { description: Service process is up. }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (DB + Redis)
      responses:
        '200': { description: All dependencies reachable. }
        '503': { description: A dependency is unreachable. }
  /health:
    get:
      tags: [Health]
      summary: Backward-compatible alias for /health/ready
      deprecated: true
      responses:
        '200': { description: See /health/ready. }

  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send an OTP to a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '+962799000000' }
      responses:
        '200':
          description: OTP dispatched.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { sent: { type: boolean } } } } }
        '400': { $ref: '#/components/schemas/Error' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and exchange for tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Tokens issued.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Tokens' } } }
        '401': { $ref: '#/components/schemas/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the session using the httpOnly refresh cookie
      description: >
        Reads the `refresh_token` httpOnly cookie (no request body), rotates it,
        sets a new cookie, and returns a fresh access token. Reuse of a revoked
        cookie revokes the whole session family.
      responses:
        '200':
          description: New access token issued; new refresh cookie set.
          headers:
            Set-Cookie: { schema: { type: string }, description: 'refresh_token=…; HttpOnly; Secure; SameSite=Strict' }
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { accessToken: { type: string } } } } }
        '401': { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the refresh token and clear the cookie
      responses:
        '200':
          description: Logged out (cookie cleared).
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { ok: { type: boolean } } } } }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, additionalProperties: true } } }
        '401': { $ref: '#/components/schemas/Error' }

  /services:
    get:
      tags: [Services]
      summary: Public service catalogue
      responses:
        '200':
          description: Active services.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Service' }

  /bookings:
    post:
      tags: [Bookings]
      summary: Create a booking (customer)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingInput' }
      responses:
        '201':
          description: >
            Booking created. `checkout` is a hosted-checkout session when a real PSP is
            configured (the booking starts AWAITING_PAYMENT until the customer authorizes
            on the widget); it is null in mock/instant mode (booking is live immediately).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      booking: { $ref: '#/components/schemas/Booking' }
                      checkout:
                        oneOf:
                          - $ref: '#/components/schemas/CheckoutSession'
                          - type: 'null'
        '400': { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/schemas/Error' }
    get:
      tags: [Bookings]
      summary: List the caller's bookings
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: List of bookings.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Booking' } } } }
  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get a single booking (party only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Booking.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Booking' } } }
        '403': { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/schemas/Error' }
  /bookings/{id}/checkout:
    post:
      tags: [Bookings]
      summary: (Re)open a hosted-checkout session (customer only)
      description: >
        Opens a payment session for a booking still AWAITING_PAYMENT. Used to retry after an
        abandoned/failed attempt, or when the initial create could not open one.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Checkout session.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/CheckoutSession' } } }
        '403': { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/schemas/Error' }
  /bookings/{id}/payment-status:
    get:
      tags: [Bookings]
      summary: Resolve a hosted-checkout outcome (customer only)
      description: >
        Finalizes the checkout idempotently (the webhook may have already resolved it) and
        returns the current state. Called from the customer's return page after paying.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Resolved checkout state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      state: { type: string, enum: [authorized, pending, rejected] }
        '403': { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/schemas/Error' }
  /bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel a booking (party only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Booking cancelled.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Booking' } } }
        '409': { $ref: '#/components/schemas/Error' }
  /bookings/{id}/accept:
    post:
      tags: [Bookings]
      summary: Technician accepts the booking
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Booking accepted.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Booking' } } }
  /bookings/{id}/status:
    post:
      tags: [Bookings]
      summary: Technician advances an active booking (EN_ROUTE → ARRIVED → IN_PROGRESS)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, enum: [EN_ROUTE, ARRIVED, IN_PROGRESS] }
      responses:
        '200':
          description: Booking advanced.
        '409': { $ref: '#/components/schemas/Error' }
  /bookings/{id}/complete:
    post:
      tags: [Bookings]
      summary: Technician completes the service
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Booking completed.

  /admin/login:
    post:
      tags: [Admin]
      summary: Admin email + password login (sets an httpOnly refresh cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginInput' }
      responses:
        '200':
          description: Access token + admin profile; refresh cookie set.
          headers:
            Set-Cookie: { schema: { type: string }, description: 'admin_refresh_token=…; HttpOnly; Secure; SameSite=Strict' }
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { accessToken: { type: string }, admin: { type: object, additionalProperties: true } } } } }
        '401': { $ref: '#/components/schemas/Error' }
  /admin/auth/refresh:
    post:
      tags: [Admin]
      summary: Rotate the admin session via the httpOnly refresh cookie
      responses:
        '200':
          description: New admin access token; new refresh cookie set.
        '401': { $ref: '#/components/schemas/Error' }
  /admin/auth/logout:
    post:
      tags: [Admin]
      summary: Revoke the admin refresh token and clear the cookie
      responses:
        '200': { description: Logged out. }
  /admin/bookings/{id}/refund:
    post:
      tags: [Admin]
      summary: Partial/full refund of a booking's captured payment (audited)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountJod]
              properties:
                amountJod: { type: string, description: 'Positive amount, ≤ outstanding captured, max 3 decimals (fils).' }
      responses:
        '200': { description: Refund applied; updated payment returned. }
        '404': { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/schemas/Error' }
  /admin/stats:
    get:
      tags: [Admin]
      summary: Aggregate dashboard metrics
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Metrics.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/DashboardSummary' } } }
  /admin/technicians:
    get:
      tags: [Admin]
      summary: List technicians (paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
        - in: query
          name: verified
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated technicians.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Technician' } }
                  - $ref: '#/components/schemas/Meta'
  /admin/technicians/{id}/verify:
    post:
      tags: [Admin]
      summary: Verify a technician (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Verification state.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Technician' } } }
  /admin/bookings:
    get:
      tags: [Admin]
      summary: List bookings (paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Paginated bookings.
  /admin/bookings.csv:
    get:
      tags: [Admin]
      summary: Bookings CSV export (OPS) — same status filter as the list endpoint, capped at 5000 rows
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [AWAITING_PAYMENT, PENDING, CONFIRMED, EN_ROUTE, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED, DISPUTED, NO_SHOW] }
      responses:
        '200': { description: CSV attachment (id, status, customer, technician, service, amounts, timestamps). }
  /admin/bookings/{id}:
    get:
      tags: [Admin]
      summary: Full booking detail for the admin drawer — booking + status history + additional work + payment (OPS)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detail. Access is audited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      booking: { $ref: '#/components/schemas/Booking' }
                      statusHistory:
                        type: array
                        items:
                          type: object
                          properties:
                            status: { type: string }
                            changedAt: { type: string, format: date-time }
                      additionalWork:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            description: { type: string }
                            amountJod: { type: string }
                            status: { type: string }
                            createdAt: { type: string, format: date-time }
                      payment:
                        type: object
                        nullable: true
        '404': { $ref: '#/components/schemas/Error' }
  /admin/payouts:
    get:
      tags: [Admin]
      summary: List payouts (paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, PROCESSED, FAILED] }
      responses:
        '200':
          description: Paginated payouts.
  /admin/payouts/{id}/process:
    post:
      tags: [Admin]
      summary: Mark a payout as processed
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Payout state.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Payout' } } }
        '409': { $ref: '#/components/schemas/Error' }
  /admin/customers:
    get:
      tags: [Admin]
      summary: List customers (paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Paginated customers.

  # ---- Reviews (public) ----
  /reviews/recent:
    get:
      tags: [Reviews]
      summary: Recent high-rated verified reviews (public, for the landing page)
      responses:
        '200': { description: A short list of recent reviews (reviewer first-name only). }

  /technicians/{id}:
    get:
      tags: [Reviews]
      summary: Public technician card (rating, vehicle, verified)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Technician public profile. }
        '404': { description: Not found. }
  /technicians/{id}/reviews:
    get:
      tags: [Reviews]
      summary: Verified reviews + rating summary for a technician
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer } }
        - { in: query, name: offset, schema: { type: integer } }
      responses:
        '200': { description: Summary + paginated reviews. }

  # ---- Promo ----
  /promo/validate:
    post:
      tags: [Promo]
      summary: Validate a promo code against a service price
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, serviceId]
              properties:
                code: { type: string }
                serviceId: { type: string }
      responses:
        '200':
          description: Discount + final amount.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PromoQuote' }
        '422': { description: Invalid/expired/exhausted code (error.code = PROMO_*). }

  # ---- Bookings (additions) ----
  /bookings/{id}/reschedule:
    post:
      tags: [Bookings]
      summary: Reschedule a not-yet-started booking
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [scheduledAt], properties: { scheduledAt: { type: string, format: date-time } } } } }
      responses: { '200': { description: Updated booking. } }
  /bookings/{id}/review:
    post:
      tags: [Bookings]
      summary: Rate the other party after completion (customer↔technician)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
                photos: { type: array, items: { type: string } }
      responses: { '201': { description: Review created. } }
  /bookings/{id}/additional-work:
    get:
      tags: [Bookings]
      summary: List additional-work items for a booking
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { '200': { description: Items. } }
    post:
      tags: [Bookings]
      summary: Technician proposes additional work (IN_PROGRESS only)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [description, amountJod], properties: { description: { type: string }, amountJod: { type: number } } } } }
      responses: { '201': { description: Proposed item. } }
  /bookings/{id}/additional-work/{itemId}/respond:
    post:
      tags: [Bookings]
      summary: Customer approves/declines a proposed additional-work item
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: itemId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [approve], properties: { approve: { type: boolean } } } } }
      responses: { '200': { description: Updated item (approval adds to the booking total). } }
  /bookings/{id}/reject:
    post:
      tags: [Bookings]
      summary: Technician rejects a dispatched offer (triggers immediate re-broadcast if none remain)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: 'Rejected: { bookingId, rejected: true }.' } }
  /bookings/{id}/no-show:
    post:
      tags: [Bookings]
      summary: Technician reports the customer as a no-show (ARRIVED only; charges the callout fee)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Booking marked NO_SHOW. }
        '409': { $ref: '#/components/schemas/Error' }
  /bookings/{id}/checklist/pre-start:
    post:
      tags: [Bookings]
      summary: Submit the pre-start SOP checklist (server-enforced gate on ARRIVED → IN_PROGRESS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoUrls]
              properties:
                photoUrls:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: uri, maxLength: 500, description: HTTPS URL only. }
      responses:
        '200': { description: Updated booking. }
        '400': { $ref: '#/components/schemas/Error' }
  /bookings/{id}/checklist/pre-close:
    post:
      tags: [Bookings]
      summary: Submit the pre-close SOP checklist (server-enforced gate on completion)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoUrls]
              properties:
                photoUrls:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: uri, maxLength: 500, description: HTTPS URL only. }
      responses:
        '200': { description: Updated booking. }
        '400': { $ref: '#/components/schemas/Error' }
  /bookings/{id}/masked-call:
    post:
      tags: [Bookings]
      summary: Get a masked-calling proxy number for the other party (Twilio Proxy)
      description: >
        Either party (customer or the assigned technician) may request a proxy number to
        dial the other without either side seeing the real number. Only available while
        the booking is active (not before assignment, not after completion/cancellation).
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Proxy session.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { proxyNumber: { type: string } } } } }
        '403': { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/schemas/Error' }

  # ---- Addresses ----
  /addresses:
    get:
      tags: [Addresses]
      summary: List my saved addresses
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Addresses. } }
    post:
      tags: [Addresses]
      summary: Add an address
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [label, line, lat, lng], properties: { label: { type: string }, line: { type: string }, lat: { type: number }, lng: { type: number }, building: { type: string }, apartment: { type: string }, notes: { type: string }, isDefault: { type: boolean } } } } }
      responses: { '201': { description: Created. } }
  /addresses/{id}:
    patch:
      tags: [Addresses]
      summary: Update an address
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Updated. } }
    delete:
      tags: [Addresses]
      summary: Delete an address
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Deleted. } }

  # ---- Payment methods (mock cards) ----
  /payment-methods:
    get:
      tags: [PaymentMethods]
      summary: List my saved cards (no PAN stored)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Cards. } }
    post:
      tags: [PaymentMethods]
      summary: Add a card (mock-tokenised)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [brand, last4, expMonth, expYear], properties: { brand: { type: string, enum: [visa, mastercard, amex] }, last4: { type: string }, expMonth: { type: integer }, expYear: { type: integer }, isDefault: { type: boolean } } } } }
      responses: { '201': { description: Created. } }
  /payment-methods/{id}/default:
    post:
      tags: [PaymentMethods]
      summary: Set a card as default
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK. } }
  /payment-methods/{id}:
    delete:
      tags: [PaymentMethods]
      summary: Remove a card
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Deleted. } }

  # ---- Notifications + devices ----
  /notifications:
    get:
      tags: [Notifications]
      summary: My notification inbox (+ unread count in meta)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Notifications. } }
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark a notification read
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Updated. } }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all read
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK. } }
  /devices:
    post:
      tags: [Devices]
      summary: Register a push device token
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, platform], properties: { token: { type: string }, platform: { type: string, enum: [ios, android, web] } } } } }
      responses: { '201': { description: Registered. } }
  /devices/{token}:
    delete:
      tags: [Devices]
      summary: Unregister a device token
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: token, required: true, schema: { type: string } }]
      responses: { '204': { description: Removed. } }

  # ---- Guarantee (customer) ----
  /guarantee/eligible:
    get:
      tags: [Guarantee]
      summary: Completed bookings still inside the 30-day guarantee window
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Eligible bookings. } }
  /guarantee:
    get:
      tags: [Guarantee]
      summary: My guarantee tickets
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Tickets. } }
    post:
      tags: [Guarantee]
      summary: Open a guarantee ticket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [bookingId, description], properties: { bookingId: { type: string, format: uuid }, description: { type: string }, mediaUrls: { type: array, items: { type: string } } } } } }
      responses: { '201': { description: Created. } }
  /guarantee/{id}:
    get:
      tags: [Guarantee]
      summary: A guarantee ticket I own
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Ticket. } }

  # ---- Support (customer) ----
  /support:
    get:
      tags: [Support]
      summary: My support tickets
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Tickets. } }
    post:
      tags: [Support]
      summary: Open a support ticket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [subject, body], properties: { subject: { type: string }, body: { type: string } } } } }
      responses: { '201': { description: Created. } }
  /support/{id}:
    get:
      tags: [Support]
      summary: A support ticket with its messages
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Ticket + thread. } }
  /support/{id}/messages:
    post:
      tags: [Support]
      summary: Reply to my support ticket
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string } } } } }
      responses: { '201': { description: Message appended. } }

  # ---- Technician self-service ----
  /technician/onboarding:
    post:
      tags: [Technician]
      summary: Apply / resubmit as a technician
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceIds, hourlyRateJod, agreementAccepted]
              properties:
                serviceIds: { type: array, minItems: 1, maxItems: 10, items: { type: string } }
                hourlyRateJod: { type: number, minimum: 40, maximum: 60 }
                vehicle: { type: string, maxLength: 120 }
                bio: { type: string, maxLength: 1000 }
                idDocUrl: { type: string, format: uri, maxLength: 500 }
                certificateUrl: { type: string, format: uri, maxLength: 500 }
                selfieUrl: { type: string, format: uri, maxLength: 500 }
                introVideoUrl: { type: string, format: uri, maxLength: 500 }
                agreementAccepted: { type: boolean, description: ToS/SOP consent — must be explicitly accepted. }
                nationalId:
                  type: string
                  minLength: 5
                  maxLength: 20
                  pattern: '^\d+$'
                  description: Jordanian national ID (digits only). Encrypted at rest; never returned by any read path.
      responses: { '201': { description: Profile (status PENDING). } }
  /technician/me:
    get:
      tags: [Technician]
      summary: My technician profile + approval status
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Profile. }, '404': { description: Not a technician yet. } }
  /technician/availability:
    patch:
      tags: [Technician]
      summary: Go online/offline (APPROVED only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [isAvailable], properties: { isAvailable: { type: boolean } } } } }
      responses: { '200': { description: Updated. }, '403': { description: Not approved. } }
  /technician/location:
    post:
      tags: [Technician]
      summary: Push current location
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [lat, lng], properties: { lat: { type: number }, lng: { type: number } } } } }
      responses: { '200': { description: Updated. } }
  /technician/jobs:
    get:
      tags: [Technician]
      summary: Nearby unassigned job requests
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Jobs with distance. } }
  /technician/earnings:
    get:
      tags: [Technician]
      summary: Earnings (today/month/total) + withdrawable balance
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Earnings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TechEarnings' }
  /technician/withdrawals:
    get:
      tags: [Technician]
      summary: My withdrawal history
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Withdrawals. } }
    post:
      tags: [Technician]
      summary: Request a cash-out (min 20 JOD, once / 24h)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [amountJod], properties: { amountJod: { type: number, minimum: 20 }, iban: { type: string, description: Jordan IBAN (JO...); falls back to the saved profile IBAN if omitted. }, bankName: { type: string } } } } }
      responses: { '201': { description: Requested. } }
  /technician/intro-video:
    post:
      tags: [Technician]
      summary: Set the profile trust video
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [videoUrl], properties: { videoUrl: { type: string, format: uri, maxLength: 500 } } } } }
      responses: { '200': { description: Updated profile. } }
  /technician/scorecard:
    get:
      tags: [Technician]
      summary: Self quality metrics (on-time / redo / complaint / acceptance rates)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Scorecard.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      onTimeRate: { type: number, example: 92.5 }
                      redoRate: { type: number, example: 1.2 }
                      complaintRate: { type: number, example: 0.4 }
                      acceptanceRate: { type: number, example: 88.1 }
                      sampleSizes:
                        type: object
                        properties:
                          arrivedBookings: { type: integer }
                          completedBookings: { type: integer }
                          totalBookings: { type: integer }
                          dispatchOffers: { type: integer }
  /technician/notification-preferences:
    get:
      tags: [Technician]
      summary: Notification toggles (created with all-true defaults on first read)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      newJobRequests: { type: boolean }
                      reminders: { type: boolean }
                      earningsUpdates: { type: boolean }
                      promotions: { type: boolean }
    patch:
      tags: [Technician]
      summary: Partial update of notification toggles
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newJobRequests: { type: boolean }
                reminders: { type: boolean }
                earningsUpdates: { type: boolean }
                promotions: { type: boolean }
      responses: { '200': { description: Updated preferences (same shape as GET). } }
  /technician/bank-account:
    get:
      tags: [Technician]
      summary: Saved payout bank details
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Bank account.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { iban: { type: string, nullable: true }, bankName: { type: string, nullable: true } } } } }
    patch:
      tags: [Technician]
      summary: Persist payout bank details independent of any one withdrawal request
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iban, bankName]
              properties:
                iban: { type: string, description: Jordan IBAN (JO + 28 chars); mod-97 checksum validated. }
                bankName: { type: string, maxLength: 120 }
      responses: { '200': { description: Updated (same shape as GET). } }
  /technician/services-pricing:
    patch:
      tags: [Technician]
      summary: Post-approval edit of services + hourly rate (APPROVED technicians only)
      description: >
        Separate from onboarding's apply(), which locks once APPROVED — this is the
        additive path for an already-approved technician to change their service list
        or rate.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceIds, hourlyRateJod]
              properties:
                serviceIds: { type: array, minItems: 1, maxItems: 10, items: { type: string } }
                hourlyRateJod: { type: number, minimum: 40, maximum: 60 }
      responses:
        '200': { description: Updated profile. }
        '403': { description: Technician is not approved. }

  # ---- Subscriptions (Protection plan) ----
  /subscriptions/me:
    get:
      tags: [Subscriptions]
      summary: My current Protection subscription + recent charges
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Latest subscription (any status, most recently created), or null if never subscribed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/SubscriptionWithCharges'
                      - type: 'null'
  /subscriptions:
    post:
      tags: [Subscriptions]
      summary: Start the Protection plan (5 JOD/mo — priority dispatch, 15% off, 90-day guarantee, quarterly inspection)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentToken: { type: string, maxLength: 200, nullable: true, description: PSP card-on-file token for renewals; the first period is billed inline if supplied. }
      responses:
        '201':
          description: Subscription created (status ACTIVE).
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Subscription' } } }
        '409': { description: Customer already has an ACTIVE subscription. }
  /subscriptions/cancel:
    post:
      tags: [Subscriptions]
      summary: Cancel at period end (benefits continue until currentPeriodEnd; no renewal after)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Subscription' } } }
        '404': { description: No ACTIVE subscription. }

  # ---- Credits (service-credit wallet) ----
  /credits/me:
    get:
      tags: [Credits]
      summary: My service-credit wallet balance + ledger history
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Wallet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      balanceJod: { type: string, example: '20.000' }
                      items: { type: array, items: { $ref: '#/components/schemas/ServiceCredit' } }

  # ---- Quotes (video pre-check) ----
  /quotes:
    post:
      tags: [Quotes]
      summary: Upload a problem video for a firm price
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, videoUrl]
              properties:
                serviceId: { type: string, format: uuid }
                videoUrl: { type: string, format: uri, maxLength: 500, description: HTTPS URL only. }
                description: { type: string, maxLength: 1000 }
                addressLine: { type: string, maxLength: 500 }
                addressLat: { type: number, minimum: -90, maximum: 90 }
                addressLng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '201':
          description: Quote created (status PENDING).
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/BookingQuote' } } }
        '404': { description: Service not found. }
        '409': { description: Service is not active. }
    get:
      tags: [Quotes]
      summary: My video pre-check quotes
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Quotes.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/BookingQuote' } } } }
  /quotes/{id}:
    get:
      tags: [Quotes]
      summary: A quote I own
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Quote.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/BookingQuote' } } }
        '404': { $ref: '#/components/schemas/Error' }
  /quotes/{id}/accept:
    post:
      tags: [Quotes]
      summary: Accept a firm quote — creates a booking at exactly quotedJod
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '201':
          description: Booking created at the quoted price.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Booking' } } }
        '403': { $ref: '#/components/schemas/Error' }
        '409': { description: Quote is not QUOTED, already accepted, or its expiresAt has passed. }

  # ---- Conduct reports (§0.2 #2 — anti-disintermediation + quality) ----
  /conduct-reports:
    post:
      tags: [Conduct]
      summary: Report off-platform solicitation, no-show, quality, or safety issues
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [OFF_PLATFORM_SOLICIT, NO_SHOW, QUALITY, SAFETY, OTHER] }
                subjectTechId: { type: string, format: uuid }
                bookingId: { type: string, format: uuid }
                details: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Report created (status OPEN).
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/ConductReport' } } }
        '404': { description: subjectTechId does not exist. }

  # ---- Referrals ----
  /referrals/me:
    get:
      tags: [Referrals]
      summary: My referral code + lifetime stats (generates the code on first access)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      referralCode: { type: string, example: 7K9XPQ }
                      totalReferred: { type: integer, description: Lifetime count of users who signed up with this code. }
                      totalCreditEarnedJod: { type: number, example: 15, description: Sum of REFERRAL-reason credit grants. }

  # ---- Uploads ----
  /uploads/presign:
    post:
      tags: [Uploads]
      summary: Issue a short-lived presigned upload URL (10 min TTL)
      description: >
        The client PUTs the file bytes to `uploadUrl`, then submits `publicUrl` as the
        corresponding field on the consuming endpoint (technician KYC docs/certificate/
        selfie, intro video, booking checklist photos, guarantee evidence). `contentType`
        must be on the allow-list for `purpose` (images for kyc_doc/selfie/certificate/
        checklist_photo/guarantee_evidence; video for intro_video). The object key is
        derived server-side — never from a client-supplied filename.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, purpose]
              properties:
                contentType: { type: string, example: image/jpeg }
                purpose: { type: string, enum: [kyc_doc, selfie, certificate, intro_video, checklist_photo, guarantee_evidence] }
      responses:
        '200':
          description: Presigned URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      uploadUrl: { type: string, format: uri }
                      publicUrl: { type: string, format: uri }
                      expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/schemas/Error' }

  # ---- Admin: technicians / customers moderation ----
  /admin/technicians/{id}:
    get:
      tags: [Admin]
      summary: Technician detail (docs, services, recent reviews) — OPS
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Detail. } }
  /admin/technicians/{id}/reject:
    post:
      tags: [Admin]
      summary: Reject a technician application (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '200': { description: Rejected. } }
  /admin/technicians/{id}/suspend:
    post:
      tags: [Admin]
      summary: Suspend an approved technician (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '200': { description: Suspended. } }
  /admin/technicians/{id}/scorecard:
    get:
      tags: [Admin]
      summary: Technician quality scorecard — on-time / redo / complaint / acceptance rates (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Scorecard (same shape as GET /technician/scorecard). } }
  /admin/customers/{id}/bookings:
    get:
      tags: [Admin]
      summary: A customer's booking history (OPS/SUPPORT)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Bookings. } }
  /admin/customers/{id}/block:
    post:
      tags: [Admin]
      summary: Block a customer (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Blocked. } }
  /admin/customers/{id}/unblock:
    post:
      tags: [Admin]
      summary: Unblock a customer (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Unblocked. } }

  # ---- Admin: quality / trust vetting (§0.2 #1) ----
  /admin/quality/techs:
    get:
      tags: [Admin]
      summary: Trust-tier quality board (vetting state, flags, tier) — paginated
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 100, minimum: 1, maximum: 200 } }
        - { in: query, name: offset, schema: { type: integer, default: 0, minimum: 0 } }
      responses: { '200': { description: 'Technicians with trustTier, bgCheckStatus, skillsTestPassedAt, isInsured, offPlatformFlags.' } }
  /admin/technicians/{id}/trust-tier:
    post:
      tags: [Admin]
      summary: Override a technician's trust tier (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [tier], properties: { tier: { type: string, enum: [PROBATION, VERIFIED, PRO, ELITE] } } } } } }
      responses: { '200': { description: Updated profile. } }
  /admin/technicians/{id}/bg-check:
    post:
      tags: [Admin]
      summary: Record a background-check result, then recompute the trust tier (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [result], properties: { result: { type: string, enum: [PASSED, FAILED] } } } } } }
      responses: { '200': { description: Updated profile. } }
  /admin/technicians/{id}/skills-test:
    post:
      tags: [Admin]
      summary: Mark the skills test passed, then recompute the trust tier (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Updated profile. } }

  # ---- Admin: conduct-report moderation (§0.2 #2) ----
  /admin/conduct-reports:
    get:
      tags: [Admin]
      summary: Conduct-report review queue (oldest first)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [OPEN, REVIEWING, UPHELD, DISMISSED] } }
        - { in: query, name: limit, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { in: query, name: offset, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200':
          description: Paginated reports.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ConductReport' } }
                  - $ref: '#/components/schemas/Meta'
  /admin/conduct-reports/{id}/resolve:
    post:
      tags: [Admin]
      summary: Resolve a conduct report — UPHELD increments the technician's offPlatformFlags (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [UPHELD, DISMISSED] } } } } } }
      responses:
        '200':
          description: Resolved report.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/ConductReport' } } }
        '409': { description: Report already resolved. }

  # ---- Admin: Protection subscriptions (growth) ----
  /admin/subscriptions:
    get:
      tags: [Admin]
      summary: Subscription list + active/past-due counts and MRR
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { in: query, name: offset, schema: { type: integer, default: 0, minimum: 0 } }
      responses: { '200': { description: 'Paginated subscriptions; meta adds activeCount, pastDueCount, mrrJod.' } }

  # ---- Admin: video pre-check quote pricing ----
  /admin/quotes:
    get:
      tags: [Admin]
      summary: Video pre-check quote queue
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [PENDING, QUOTED, ACCEPTED, DECLINED, EXPIRED] } }
        - { in: query, name: limit, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { in: query, name: offset, schema: { type: integer, default: 0, minimum: 0 } }
      responses: { '200': { description: Paginated quotes. } }
  /admin/quotes/{id}/quote:
    post:
      tags: [Admin]
      summary: Set a firm price on a pending quote (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quotedJod]
              properties:
                quotedJod: { type: string, description: 'Positive amount, max 3 decimal places (fils).' }
      responses:
        '200':
          description: Quoted (status QUOTED); customer notified.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/BookingQuote' } } }
        '409': { description: Quote is not PENDING. }

  # ---- Admin: operational KPIs ----
  /admin/stats/operational:
    get:
      tags: [Admin]
      summary: Operational KPIs over a trailing window (OPS)
      description: >
        Acceptance rate, avg time-to-assign, avg arrival delay, cancellation rate,
        upheld-complaint rate, and repeat-booking rate over the last `windowDays` days.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: windowDays, schema: { type: integer, default: 30, minimum: 1, maximum: 90 } }
      responses: { '200': { description: KPIs. } }
  /admin/orders/at-risk:
    get:
      tags: [Admin]
      summary: Active bookings that are late (past SLA, not yet arrived) or unassigned too long (OPS)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses: { '200': { description: 'Bookings tagged riskType: late | unassigned.' } }
  /admin/activity-feed:
    get:
      tags: [Admin]
      summary: Recent notable platform events for the live-activity feed (OPS)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses: { '200': { description: 'Events (booking status changes, payments captured, guarantees opened, new customers) from the trailing 48h window.' } }

  # ---- Admin: guarantee / support ----
  /admin/guarantee:
    get:
      tags: [Admin]
      summary: Guarantee ticket queue (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: query, name: status, schema: { type: string } }]
      responses: { '200': { description: Tickets. } }
  /admin/guarantee/{id}/in-review:
    post:
      tags: [Admin]
      summary: Mark a guarantee ticket in-review (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Updated. } }
  /admin/guarantee/{id}/review:
    post:
      tags: [Admin]
      summary: Approve/reject a guarantee ticket (OPS)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [APPROVED, REJECTED] }, adminNote: { type: string }, scheduledVisitAt: { type: string, format: date-time } } } } } }
      responses: { '200': { description: Finalised; customer notified. } }
  /admin/support:
    get:
      tags: [Admin]
      summary: Support inbox (SUPPORT)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: query, name: status, schema: { type: string } }]
      responses: { '200': { description: Tickets. } }
  /admin/support/{id}:
    get:
      tags: [Admin]
      summary: A support ticket + thread (SUPPORT)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Ticket. } }
  /admin/support/{id}/messages:
    post:
      tags: [Admin]
      summary: Admin reply (SUPPORT; notifies customer)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string } } } } } }
      responses: { '201': { description: Replied. } }
  /admin/support/{id}/status:
    post:
      tags: [Admin]
      summary: Set support ticket status (SUPPORT)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [OPEN, IN_PROGRESS, CLOSED] } } } } } }
      responses: { '200': { description: Updated. } }

  # ---- Admin: broadcast / finance / admins (RBAC) ----
  /admin/broadcasts:
    get:
      tags: [Admin]
      summary: Past broadcasts (OPS)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Broadcasts. } }
    post:
      tags: [Admin]
      summary: Send a broadcast notification to a segment (OPS)
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [titleAr, bodyAr, segment], properties: { titleAr: { type: string }, bodyAr: { type: string }, segment: { type: string, enum: [ALL, CUSTOMERS, TECHNICIANS] } } } } } }
      responses: { '201': { description: Sent; fanned out to recipients. } }
  /admin/reports/financial:
    get:
      tags: [Admin]
      summary: Financial revenue time-series (FINANCE)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date-time } }
