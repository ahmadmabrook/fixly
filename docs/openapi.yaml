      responses:
        '200':
          description: Series + totals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FinancialReport' }
  /admin/reports/financial.csv:
    get:
      tags: [Admin]
      summary: Financial report as CSV (FINANCE)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: to, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: granularity, schema: { type: string, enum: [day, month] } }
      responses: { '200': { description: CSV attachment. } }
  /admin/withdrawals:
    get:
      tags: [Admin]
      summary: Technician withdrawal requests (FINANCE)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: query, name: status, schema: { type: string } }]
      responses: { '200': { description: Withdrawals. } }
  /admin/withdrawals/{id}/process:
    post:
      tags: [Admin]
      summary: Mark a withdrawal PAID/REJECTED (FINANCE)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [PAID, REJECTED] } } } } } }
      responses: { '200': { description: Updated. } }
  /admin/admins:
    get:
      tags: [Admin]
      summary: List admin users (SUPER_ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Admins.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
    post:
      tags: [Admin]
      summary: Create an admin user (SUPER_ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password, name, role], properties: { email: { type: string, format: email }, password: { type: string, minLength: 12 }, name: { type: string }, role: { type: string, enum: [SUPER_ADMIN, OPS, FINANCE, SUPPORT] } } } } } }
      responses: { '201': { description: Created. } }
  /admin/admins/{id}/role:
    post:
      tags: [Admin]
      summary: Change an admin's role (SUPER_ADMIN)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [role], properties: { role: { type: string, enum: [SUPER_ADMIN, OPS, FINANCE, SUPPORT] } } } } } }
      responses: { '200': { description: Updated. } }
  /admin/admins/{id}/active:
    post:
      tags: [Admin]
      summary: Enable/disable an admin (SUPER_ADMIN; cannot disable self)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [isActive], properties: { isActive: { type: boolean } } } } } }
      responses: { '200': { description: Updated. } }

  /webhooks/psp:
    post:
      tags: [Webhooks]
      summary: Inbound PSP webhook (signed; raw body)
      description: >
        Verified by HMAC `X-PSP-Signature` over the raw body, then deduped by
        (provider, eventId). Handles capture/refund/dispute/chargeback/auth-expiry.
      parameters:
        - in: header
          name: X-PSP-Signature
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, type, providerRef]
              properties:
                eventId: { type: string }
                type: { type: string, example: payment.dispute.opened }
                providerRef: { type: string }
                amountJod: { type: number }
                reason: { type: string }
                disputeWon: { type: boolean }
      responses:
        '200': { description: Accepted (or duplicate). }
        '400': { $ref: '#/components/schemas/Error' }

  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics
      description: >
        Guarded by `METRICS_TOKEN` (Bearer) when set; returns 404 in production
        if unset. HTTP/outbox/payment/payout/webhook series + default process metrics.
      responses:
        '200': { description: Prometheus text exposition. }
        '401': { $ref: '#/components/schemas/Error' }

# ---------------------------------------------------------------------------
# Realtime
# ---------------------------------------------------------------------------
webhooks: {}

x-realtime:
  description: |
    Socket.io endpoint at /socket.io. Authenticate on handshake with
    `{ auth: { token: <jwt> } }`. The user must be a customer or technician
    (admins have no socket surface).

  events:
    server->client:
      booking:status:
        summary: Emitted to the customer's `user:{userId}` room on lifecycle changes.
        payload:
          type: object
          properties:
            bookingId: { type: string, format: uuid }
            status: { type: string, enum: [PENDING, CONFIRMED, EN_ROUTE, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED, DISPUTED] }
            titleAr: { type: string }
            at: { type: integer, description: Server timestamp (ms since epoch) }
      location:update:
        summary: Emitted to `booking:{bookingId}` room when the assigned technician publishes a new fix.
        payload:
          type: object
          properties:
            technicianId: { type: string }
            bookingId: { type: string }
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
            at: { type: integer }
    client->server:
      booking:join:
        summary: Subscribe to a specific booking's room. Server enforces party-of-booking.
        payload: { type: string, format: uuid }
      booking:leave:
        summary: Unsubscribe from a booking's room.
        payload: { type: string, format: uuid }
      location:update:
        summary: Technician publishes a position fix for a booking.
        payload:
          type: object
          required: [bookingId, lat, lng]
          properties:
            bookingId: { type: string }
            lat: { type: number }
            lng: { type: number }
