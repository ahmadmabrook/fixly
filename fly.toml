app = 'fixly'
primary_region = 'fra'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  NODE_ENV = 'staging'
  PORT = '4000'
  PAYMENT_PROVIDER = 'mock'
  OTP_PROVIDER = 'mock'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/live'

[[http_service.checks]]
  grace_period = '15s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
